# Fails the build if a production npm dependency's license is outside the
# allow list. Extend the list deliberately, one identifier at a time, after
# checking what pulled it in (npx license-checker-rseidelsohn --production
# --summary shows the breakdown).

name: License check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  npm-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check production dependency licenses
        run: >
          pnpm dlx license-checker-rseidelsohn
          --production
          --excludePrivatePackages
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;MPL-2.0;Python-2.0;CC-BY-4.0"
