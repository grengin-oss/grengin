name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required for gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned backend commit
        id: backend
        shell: bash
        run: |
          BACKEND_COMMIT="$(tr -d '[:space:]' < release/backend-commit.txt)"
          if [[ ! "${BACKEND_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release/backend-commit.txt must contain a full commit SHA" >&2
            exit 1
          fi
          echo "commit=${BACKEND_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pinned backend
        uses: actions/checkout@v4
        with:
          repository: grengin-oss/grengin-api
          ref: ${{ steps.backend.outputs.commit }}
          path: .release-work/grengin-api

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate backend build
        working-directory: .release-work/grengin-api
        run: cargo build --release --locked --workspace --jobs 2

      - name: Package complete release
        env:
          BACKEND_SOURCE_DIR: ${{ github.workspace }}/.release-work/grengin-api
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Grengin ${GITHUB_REF_NAME}" \
            --generate-notes \
            release-dist/grengin-*.tar.gz \
            release-dist/grengin-*.zip \
            release-dist/grengin-*-SHA256SUMS.txt
